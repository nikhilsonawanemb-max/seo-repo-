<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-title" content="Paperclip" />
    <meta name="description" content="Paperclip is the app people use to manage AI agents for work. Open-source orchestration for teams of AI agents - org charts, goals, budgets, and governance." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://paperclip.ai/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Paperclip - Manage AI Agents for Work" />
    <meta property="og:description" content="Open-source orchestration for teams of AI agents. Manage business goals, not pull requests. Bring your own agents, assign goals, track work and costs." />
    <meta property="og:url" content="https://paperclip.ai/" />
    <meta property="og:site_name" content="Paperclip" />
    <meta property="og:image" content="/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paperclip - Manage AI Agents for Work" />
    <meta name="twitter:description" content="Open-source orchestration for teams of AI agents. Manage business goals, not pull requests." />
    <meta name="twitter:image" content="/android-chrome-512x512.png" />
    <title>Paperclip - Manage AI Agents for Work</title>
    <!-- PAPERCLIP_RUNTIME_BRANDING_START -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_END -->
    <!-- PAPERCLIP_FAVICON_START -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- PAPERCLIP_FAVICON_END -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <script>
      (() => {
        const key = "paperclip.theme";
        const darkThemeColor = "#18181b";
        const lightThemeColor = "#ffffff";
        try {
          const stored = window.localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const fallback = prefersDark ? "dark" : "light";
          const theme = stored === "light" || stored === "dark" ? stored : fallback;
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
